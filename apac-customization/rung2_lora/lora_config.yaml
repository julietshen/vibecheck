# LoRA fine-tune of Qwen3-1.7B for APAC illegal-moneylending detection (MLX).
# Small adapter, small data, minutes on an M-series Mac. Run from project root:
#   ../.venv/bin/python -m mlx_lm lora --config rung2_lora/lora_config.yaml
model: "mlx-community/Qwen3-1.7B-bf16"
train: true
data: "data/mlx"          # expects train.jsonl / valid.jsonl (prompt+completion)
adapter_path: "rung2_lora/adapters"

fine_tune_type: lora
num_layers: 8             # LoRA on the top 8 transformer blocks
batch_size: 4
iters: 300
learning_rate: 1e-4
steps_per_report: 25
steps_per_eval: 100
save_every: 150
max_seq_length: 512
grad_checkpoint: false

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
