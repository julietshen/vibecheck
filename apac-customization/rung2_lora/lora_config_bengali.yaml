# LoRA fine-tune of Qwen3-1.7B on Bengali (romanized) offensive language (TB-OLID).
# Shows fine-tuning closing the language gap that every off-the-shelf model hit.
# Run from project root:
#   ../.venv/bin/python -m mlx_lm lora --config rung2_lora/lora_config_bengali.yaml
model: "mlx-community/Qwen3-1.7B-bf16"
train: true
data: "data/bengali/mlx"
adapter_path: "rung2_lora/adapters_bengali"

fine_tune_type: lora
num_layers: 8
batch_size: 4
iters: 300
learning_rate: 1e-4
steps_per_report: 25
steps_per_eval: 150
save_every: 150
max_seq_length: 512
grad_checkpoint: false

lora_parameters:
  rank: 16
  scale: 20.0
  dropout: 0.0
